name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilación
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk simulador-foto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: simulador-foto-apk
          path: simulador-foto.apk

      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" simulador-foto.apk \
            --title "Simulador Foto $TAG" \
            --notes "APK compilado automáticamente. Descarga simulador-foto.apk e instálalo (se puede instalar encima de la versión anterior)." \
            --latest

      # En otras ramas (lanzado a mano) se publica como versión de prueba:
      # la web sigue descargando la última versión de main
      - name: Publicar versión de prueba
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prueba-${{ github.run_number }}"
          gh release create "$TAG" simulador-foto.apk \
            --target "${{ github.sha }}" \
            --title "Prueba $TAG" \
            --notes "Versión de prueba, todavía sin publicar. La web sigue descargando la última versión normal." \
            --prerelease --latest=false
