name: Pruebas en emulador

on:
  push:
    branches: [ 'prueba-*' ]
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            chmod +x gradlew
            adb logcat -c || true
            ./gradlew --no-daemon connectedDebugAndroidTest || echo "PRUEBAS FALLIDAS"
            echo "===== LOG GESTOS ====="
            adb logcat -d -s Gestos:D | tail -n 80
            echo "===== ERRORES ====="
            adb logcat -d | grep -E "AndroidRuntime|FATAL|TestRunner.*(failed|finished)" | head -n 40
            echo "===== RESULTADOS XML ====="
            find app/build/outputs/androidTest-results -name "*.xml" -exec sed -n '1,80p' {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/androidTest-results/
